<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生产排产计划系统 - 库存管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        *::-webkit-scrollbar {
            display: none;
        }
        .phone-frame {
            width: 375px;
            height: 640px;
            border: 12px solid #000;
            border-radius: 36px;
            position: relative;
            background: #fff;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .status-bar {
            height: 44px;
            background: transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            color: #333;
            font-size: 14px;
            position: relative;
            z-index: 10;
        }
        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 30px;
            background: #000;
            border-radius: 0 0 20px 20px;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="phone-frame">
        <div class="notch"></div>
        <div class="status-bar">
            <span>9:41</span>
            <div class="flex gap-1">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-three-quarters"></i>
            </div>
        </div>

        <div class="h-full bg-gray-50 relative">
            <!-- 顶部导航 -->
            <div class="bg-white shadow-sm px-4 py-3 flex items-center justify-between">
                <div class="flex items-center">
                    <button class="mr-3">
                        <i class="fas fa-arrow-left text-gray-600 text-xl"></i>
                    </button>
                    <h1 class="text-lg font-semibold text-gray-800">库存管理</h1>
                </div>
                <div class="flex items-center gap-3">
                    <button>
                        <i class="fas fa-search text-gray-600 text-xl"></i>
                    </button>
                    <button>
                        <i class="fas fa-download text-gray-600 text-xl"></i>
                    </button>
                </div>
            </div>

            <!-- 主要内容区域 -->
            <div class="px-4 py-4 overflow-y-auto" style="height: calc(100% - 44px - 60px - 60px);">
                <!-- 库存概览卡片 -->
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <div class="bg-gradient-to-br from-blue-500 to-blue-600 rounded-2xl p-4 text-white shadow-lg">
                        <div class="flex items-center justify-between mb-2">
                            <i class="fas fa-cubes text-2xl opacity-80"></i>
                            <span class="text-xs bg-white/20 px-2 py-1 rounded-full">当前</span>
                        </div>
                        <p class="text-2xl font-bold">2,456</p>
                        <p class="text-sm opacity-90">原物料种类</p>
                    </div>

                    <div class="bg-gradient-to-br from-green-500 to-green-600 rounded-2xl p-4 text-white shadow-lg">
                        <div class="flex items-center justify-between mb-2">
                            <i class="fas fa-chart-line text-2xl opacity-80"></i>
                            <span class="text-xs bg-white/20 px-2 py-1 rounded-full">安全</span>
                        </div>
                        <p class="text-2xl font-bold">89%</p>
                        <p class="text-sm opacity-90">库存健康度</p>
                    </div>
                </div>

                <!-- 库存预警 -->
                <div class="bg-red-50 border border-red-200 rounded-2xl p-4 mb-4">
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="text-base font-semibold text-red-800">库存预警</h3>
                        <span class="text-xs bg-red-100 text-red-600 px-2 py-1 rounded-full">3 项</span>
                    </div>
                    <div class="space-y-2">
                        <div class="flex items-center justify-between bg-white rounded-lg p-2">
                            <div class="flex items-center">
                                <div class="w-2 h-2 bg-red-500 rounded-full mr-2"></div>
                                <div>
                                    <p class="text-sm font-medium text-gray-800">维生素C粉末</p>
                                    <p class="text-xs text-gray-500">当前: 125kg | 安全: 200kg</p>
                                </div>
                            </div>
                            <button class="text-xs bg-red-100 text-red-600 px-2 py-1 rounded">采购</button>
                        </div>
                        <div class="flex items-center justify-between bg-white rounded-lg p-2">
                            <div class="flex items-center">
                                <div class="w-2 h-2 bg-yellow-500 rounded-full mr-2"></div>
                                <div>
                                    <p class="text-sm font-medium text-gray-800">包装盒A型</p>
                                    <p class="text-xs text-gray-500">当前: 850个 | 安全: 1000个</p>
                                </div>
                            </div>
                            <button class="text-xs bg-yellow-100 text-yellow-600 px-2 py-1 rounded">关注</button>
                        </div>
                    </div>
                </div>

                <!-- 物料分类 -->
                <div class="bg-white rounded-2xl p-4 shadow-sm mb-4">
                    <h3 class="text-base font-semibold text-gray-800 mb-3">物料分类</h3>
                    <div class="grid grid-cols-3 gap-3">
                        <button class="bg-purple-50 rounded-xl p-3 text-center">
                            <i class="fas fa-flask text-purple-600 text-xl mb-1"></i>
                            <p class="text-xs text-gray-700">内容物</p>
                            <p class="text-xs text-purple-600 font-medium">156种</p>
                        </button>
                        <button class="bg-blue-50 rounded-xl p-3 text-center">
                            <i class="fas fa-box text-blue-600 text-xl mb-1"></i>
                            <p class="text-xs text-gray-700">内包材</p>
                            <p class="text-xs text-blue-600 font-medium">89种</p>
                        </button>
                        <button class="bg-green-50 rounded-xl p-3 text-center">
                            <i class="fas fa-cube text-green-600 text-xl mb-1"></i>
                            <p class="text-xs text-gray-700">外包材</p>
                            <p class="text-xs text-green-600 font-medium">124种</p>
                        </button>
                    </div>
                </div>

                <!-- 库存趋势图 -->
                <div class="bg-white rounded-2xl p-4 shadow-sm mb-4">
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="text-base font-semibold text-gray-800">库存变动趋势</h3>
                        <select class="text-xs bg-gray-50 border border-gray-200 rounded-lg px-2 py-1">
                            <option>最近7天</option>
                            <option>最近30天</option>
                        </select>
                    </div>

                    <!-- 简化的趋势图 -->
                    <div class="h-32 flex items-end justify-between gap-2">
                        <div class="flex-1 bg-purple-200 rounded-t" style="height: 60%"></div>
                        <div class="flex-1 bg-purple-300 rounded-t" style="height: 75%"></div>
                        <div class="flex-1 bg-purple-400 rounded-t" style="height: 45%"></div>
                        <div class="flex-1 bg-purple-500 rounded-t" style="height: 80%"></div>
                        <div class="flex-1 bg-purple-600 rounded-t" style="height: 90%"></div>
                        <div class="flex-1 bg-purple-400 rounded-t" style="height: 70%"></div>
                        <div class="flex-1 bg-purple-300 rounded-t" style="height: 85%"></div>
                    </div>

                    <div class="flex justify-between mt-2">
                        <span class="text-xs text-gray-500">3/15</span>
                        <span class="text-xs text-gray-500">3/21</span>
                    </div>
                </div>

                <!-- 主要物料列表 -->
                <div class="bg-white rounded-2xl p-4 shadow-sm">
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="text-base font-semibold text-gray-800">主要物料</h3>
                        <a href="#" class="text-sm text-purple-600">查看全部</a>
                    </div>

                    <div class="space-y-2">
                        <div class="flex items-center justify-between py-2 border-b border-gray-100">
                            <div class="flex items-center">
                                <div class="w-8 h-8 bg-purple-100 rounded-lg flex items-center justify-center mr-3">
                                    <i class="fas fa-flask text-purple-600 text-xs"></i>
                                </div>
                                <div>
                                    <p class="text-sm font-medium text-gray-800">乳清蛋白粉</p>
                                    <p class="text-xs text-gray-500">内容物</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <p class="text-sm font-medium text-gray-800">1,250kg</p>
                                <p class="text-xs text-green-600">充足</p>
                            </div>
                        </div>

                        <div class="flex items-center justify-between py-2 border-b border-gray-100">
                            <div class="flex items-center">
                                <div class="w-8 h-8 bg-blue-100 rounded-lg flex items-center justify-center mr-3">
                                    <i class="fas fa-box text-blue-600 text-xs"></i>
                                </div>
                                <div>
                                    <p class="text-sm font-medium text-gray-800">塑料瓶500ml</p>
                                    <p class="text-xs text-gray-500">内包材</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <p class="text-sm font-medium text-gray-800">8,500个</p>
                                <p class="text-xs text-yellow-600">偏低</p>
                            </div>
                        </div>

                        <div class="flex items-center justify-between py-2">
                            <div class="flex items-center">
                                <div class="w-8 h-8 bg-green-100 rounded-lg flex items-center justify-center mr-3">
                                    <i class="fas fa-cube text-green-600 text-xs"></i>
                                </div>
                                <div>
                                    <p class="text-sm font-medium text-gray-800">包装纸盒</p>
                                    <p class="text-xs text-gray-500">外包材</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <p class="text-sm font-medium text-gray-800">12,000个</p>
                                <p class="text-xs text-green-600">充足</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 底部导航栏 -->
            <div class="absolute bottom-0 left-0 right-0 bg-white border-t border-gray-200">
                <div class="grid grid-cols-4 py-2">
                    <button class="flex flex-col items-center py-2">
                        <i class="fas fa-home text-gray-400 text-xl mb-1"></i>
                        <span class="text-xs text-gray-400">首页</span>
                    </button>
                    <button class="flex flex-col items-center py-2">
                        <i class="fas fa-list-alt text-gray-400 text-xl mb-1"></i>
                        <span class="text-xs text-gray-400">订单</span>
                    </button>
                    <button class="flex flex-col items-center py-2">
                        <i class="fas fa-boxes text-purple-600 text-xl mb-1"></i>
                        <span class="text-xs text-purple-600">库存</span>
                    </button>
                    <button class="flex flex-col items-center py-2">
                        <i class="fas fa-user text-gray-400 text-xl mb-1"></i>
                        <span class="text-xs text-gray-400">我的</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
