<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生产排产计划系统 - 智能排产</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        *::-webkit-scrollbar {
            display: none;
        }
        .phone-frame {
            width: 375px;
            height: 640px;
            border: 12px solid #000;
            border-radius: 36px;
            position: relative;
            background: #fff;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .status-bar {
            height: 44px;
            background: transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            color: #333;
            font-size: 14px;
            position: relative;
            z-index: 10;
        }
        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 30px;
            background: #000;
            border-radius: 0 0 20px 20px;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="phone-frame">
        <div class="notch"></div>
        <div class="status-bar">
            <span>9:41</span>
            <div class="flex gap-1">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-three-quarters"></i>
            </div>
        </div>

        <div class="h-full bg-gray-50 relative">
            <!-- 顶部导航 -->
            <div class="bg-white shadow-sm px-4 py-3 flex items-center justify-between">
                <div class="flex items-center">
                    <button class="mr-3">
                        <i class="fas fa-arrow-left text-gray-600 text-xl"></i>
                    </button>
                    <h1 class="text-lg font-semibold text-gray-800">智能排产</h1>
                </div>
                <button>
                    <i class="fas fa-history text-gray-600 text-xl"></i>
                </button>
            </div>

            <!-- 主要内容区域 -->
            <div class="px-4 py-4 overflow-y-auto" style="height: calc(100% - 44px - 60px - 60px);">
                <!-- 排产参数设置 -->
                <div class="bg-white rounded-2xl p-4 shadow-sm mb-4">
                    <h3 class="text-lg font-semibold text-gray-800 mb-4">排产参数设置</h3>

                    <div class="space-y-4">
                        <div>
                            <label class="text-sm font-medium text-gray-700 mb-2 block">排产时间范围</label>
                            <div class="grid grid-cols-2 gap-3">
                                <div class="bg-gray-50 rounded-xl px-3 py-2 border border-gray-200">
                                    <input type="date" class="w-full bg-transparent text-sm outline-none" value="2024-03-15">
                                </div>
                                <div class="bg-gray-50 rounded-xl px-3 py-2 border border-gray-200">
                                    <input type="date" class="w-full bg-transparent text-sm outline-none" value="2024-03-22">
                                </div>
                            </div>
                        </div>

                        <div>
                            <label class="text-sm font-medium text-gray-700 mb-2 block">工厂选择</label>
                            <select class="w-full bg-gray-50 rounded-xl px-3 py-2 border border-gray-200 text-sm">
                                <option>工厂A - 主生产基地</option>
                                <option>工厂B - 配套生产基地</option>
                            </select>
                        </div>

                        <div>
                            <label class="text-sm font-medium text-gray-700 mb-2 block">排产策略</label>
                            <div class="space-y-2">
                                <label class="flex items-center justify-between bg-gray-50 rounded-xl p-3 cursor-pointer">
                                    <div class="flex items-center">
                                        <input type="radio" name="strategy" checked class="text-purple-600">
                                        <span class="ml-3 text-sm">优先级优先</span>
                                    </div>
                                    <span class="text-xs text-gray-500">按订单优先级排序</span>
                                </label>
                                <label class="flex items-center justify-between bg-gray-50 rounded-xl p-3 cursor-pointer">
                                    <div class="flex items-center">
                                        <input type="radio" name="strategy" class="text-purple-600">
                                        <span class="ml-3 text-sm">交期优先</span>
                                    </div>
                                    <span class="text-xs text-gray-500">按完工时间排序</span>
                                </label>
                                <label class="flex items-center justify-between bg-gray-50 rounded-xl p-3 cursor-pointer">
                                    <div class="flex items-center">
                                        <input type="radio" name="strategy" class="text-purple-600">
                                        <span class="ml-3 text-sm">均衡排产</span>
                                    </div>
                                    <span class="text-xs text-gray-500">平衡产线负载</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 待排产订单概览 -->
                <div class="bg-white rounded-2xl p-4 shadow-sm mb-4">
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="text-lg font-semibold text-gray-800">待排产订单</h3>
                        <span class="text-sm bg-purple-100 text-purple-600 px-2 py-1 rounded-full">共 8 个</span>
                    </div>

                    <div class="grid grid-cols-2 gap-3 mb-3">
                        <div class="bg-gradient-to-br from-green-50 to-green-100 rounded-xl p-3">
                            <div class="flex items-center justify-between mb-1">
                                <i class="fas fa-check-circle text-green-600"></i>
                                <span class="text-xs text-green-600">可排产</span>
                            </div>
                            <p class="text-xl font-bold text-gray-800">5</p>
                            <p class="text-xs text-gray-600">正常订单</p>
                        </div>
                        <div class="bg-gradient-to-br from-red-50 to-red-100 rounded-xl p-3">
                            <div class="flex items-center justify-between mb-1">
                                <i class="fas fa-exclamation-triangle text-red-600"></i>
                                <span class="text-xs text-red-600">异常</span>
                            </div>
                            <p class="text-xl font-bold text-gray-800">3</p>
                            <p class="text-xs text-gray-600">问题订单</p>
                        </div>
                    </div>

                    <!-- 订单列表预览 -->
                    <div class="space-y-2">
                        <div class="flex items-center justify-between bg-gray-50 rounded-xl p-2">
                            <div class="flex items-center">
                                <span class="text-xs bg-purple-100 text-purple-600 px-2 py-1 rounded mr-2">高</span>
                                <div>
                                    <p class="text-sm font-medium text-gray-800">A001-保健品生产</p>
                                    <p class="text-xs text-gray-500">数量: 1000箱</p>
                                </div>
                            </div>
                            <i class="fas fa-chevron-right text-gray-400 text-sm"></i>
                        </div>
                        <div class="flex items-center justify-between bg-gray-50 rounded-xl p-2">
                            <div class="flex items-center">
                                <span class="text-xs bg-yellow-100 text-yellow-600 px-2 py-1 rounded mr-2">中</span>
                                <div>
                                    <p class="text-sm font-medium text-gray-800">B002-营养品生产</p>
                                    <p class="text-xs text-gray-500">数量: 500箱</p>
                                </div>
                            </div>
                            <i class="fas fa-chevron-right text-gray-400 text-sm"></i>
                        </div>
                    </div>
                </div>

                <!-- 一键排产按钮 -->
                <button class="w-full bg-gradient-to-r from-purple-600 to-blue-600 text-white py-4 rounded-2xl font-semibold shadow-lg hover:shadow-xl transform hover:scale-105 transition-all duration-200 flex items-center justify-center">
                    <i class="fas fa-magic mr-2"></i>
                    开始智能排产
                </button>

                <!-- 排产进度显示 -->
                <div class="bg-white rounded-2xl p-4 shadow-sm mt-4">
                    <h3 class="text-lg font-semibold text-gray-800 mb-3">排产进度</h3>

                    <div class="space-y-3">
                        <div>
                            <div class="flex items-center justify-between text-sm mb-1">
                                <span class="text-gray-600">数据分析中</span>
                                <span class="text-green-600">已完成</span>
                            </div>
                            <div class="w-full bg-gray-200 rounded-full h-2">
                                <div class="bg-green-500 h-2 rounded-full" style="width: 100%"></div>
                            </div>
                        </div>

                        <div>
                            <div class="flex items-center justify-between text-sm mb-1">
                                <span class="text-gray-600">物料检查</span>
                                <span class="text-green-600">已完成</span>
                            </div>
                            <div class="w-full bg-gray-200 rounded-full h-2">
                                <div class="bg-green-500 h-2 rounded-full" style="width: 100%"></div>
                            </div>
                        </div>

                        <div>
                            <div class="flex items-center justify-between text-sm mb-1">
                                <span class="text-gray-600">产线分配</span>
                                <span class="text-blue-600">进行中 65%</span>
                            </div>
                            <div class="w-full bg-gray-200 rounded-full h-2">
                                <div class="bg-blue-500 h-2 rounded-full" style="width: 65%"></div>
                            </div>
                        </div>

                        <div>
                            <div class="flex items-center justify-between text-sm mb-1">
                                <span class="text-gray-600">时间规划</span>
                                <span class="text-gray-400">等待中</span>
                            </div>
                            <div class="w-full bg-gray-200 rounded-full h-2">
                                <div class="bg-gray-300 h-2 rounded-full" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>

                    <div class="mt-4 p-3 bg-blue-50 rounded-xl">
                        <div class="flex items-center">
                            <i class="fas fa-info-circle text-blue-600 mr-2"></i>
                            <p class="text-sm text-blue-800">预计还需2分钟完成排产计算</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 底部导航栏 -->
            <div class="absolute bottom-0 left-0 right-0 bg-white border-t border-gray-200">
                <div class="grid grid-cols-4 py-2">
                    <button class="flex flex-col items-center py-2">
                        <i class="fas fa-home text-gray-400 text-xl mb-1"></i>
                        <span class="text-xs text-gray-400">首页</span>
                    </button>
                    <button class="flex flex-col items-center py-2">
                        <i class="fas fa-list-alt text-gray-400 text-xl mb-1"></i>
                        <span class="text-xs text-gray-400">订单</span>
                    </button>
                    <button class="flex flex-col items-center py-2">
                        <i class="fas fa-magic text-purple-600 text-xl mb-1"></i>
                        <span class="text-xs text-purple-600">排产</span>
                    </button>
                    <button class="flex flex-col items-center py-2">
                        <i class="fas fa-user text-gray-400 text-xl mb-1"></i>
                        <span class="text-xs text-gray-400">我的</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
